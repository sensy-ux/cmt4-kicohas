<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fc;
}

header{
    background:linear-gradient(to right,#0d47a1,#42a5f5);
    color:white;
    text-align:center;
    padding:40px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    padding:20px;
}

.photo{
    width:300px;
    height:200px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.btn{
    display:block;
    width:150px;
    margin:20px auto;
    text-align:center;
    background:#0d47a1;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:5px;
}

</style>
</head>

<body>

<header>
<h1>Gallery</h1>
<p>CMT4 KICOHAS Memories</p>
</header>

<div class="gallery">

<div class="photo">
<img src="https://picsum.photos/300/200?1">
</div>

<div class="photo">
<img src="images/Snapchat-2070525634.jpg">
</div>

<div class="photo">
<img src="images/Snapchat-1360467269_1.jpg">
</div>

<div class="photo">
<img src="images/IMG-20260528-WA0060_1.jpg">
</div>

</div>

<a href="index.html" class="btn">Back Home</a>

</body>
</html>
