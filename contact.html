<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>

<style>

body{
font-family:Arial;
background:#f4f7fc;
margin:0;
}

header{
background:#0d47a1;
color:white;
text-align:center;
padding:40px;
}

.container{
width:90%;
max-width:600px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0d47a1;
color:white;
border:none;
padding:12px;
width:100%;
margin-top:10px;
border-radius:5px;
}

a{
display:block;
text-align:center;
margin-top:15px;
}

</style>
</head>

<body>

<header>
<h1>Contact Us</h1>
</header>

<div class="container">

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<textarea rows="5" placeholder="Your Message"></textarea>

<button>Send Message</button>

<a href="index.html">Back Home</a>

</div>

</body>
</html>
